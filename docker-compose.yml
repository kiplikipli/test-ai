version: '3.9'
services:
  ai-brain:
    build: ./ai-brain
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      REDIS_URL: redis://redis:6379/0
      N8N_BASE_URL: http://n8n:5678/webhook
    depends_on:
      - redis
      - n8n
    networks:
      - internal

  redis:
    image: redis:7-alpine
    networks:
      - internal

  n8n:
    image: n8nio/n8n:latest
    ports:
      - '5678:5678'
    environment:
      N8N_HOST: n8n
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      DB_TYPE: mysqldb
      DB_MYSQLDB_HOST: mysql
      DB_MYSQLDB_DATABASE: n8n
      DB_MYSQLDB_USER: n8n
      DB_MYSQLDB_PASSWORD: n8n
    depends_on:
      - redis
      - mysql
    networks:
      - internal

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: n8n
      MYSQL_USER: n8n
      MYSQL_PASSWORD: n8n
    ports:
      - '3306:3306'
    networks:
      - internal

networks:
  internal:
    driver: bridge
