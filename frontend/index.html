<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enterprise Meeting Assistant</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 720px; margin: 2rem auto; }
      #chat-log { border: 1px solid #ccc; border-radius: 8px; min-height: 280px; padding: 1rem; margin-bottom: 1rem; }
      .line { margin: 0.5rem 0; }
      .user { color: #0a58ca; }
      .bot { color: #146c43; }
      form { display: flex; gap: 0.5rem; }
      input { flex: 1; padding: 0.75rem; }
      button { padding: 0.75rem 1rem; }
    </style>
  </head>
  <body>
    <h1>Meeting Booking AI</h1>
    <div id="chat-log"></div>
    <form id="chat-form">
      <input id="message" placeholder="Ask to schedule a meeting..." required />
      <button type="submit">Send</button>
    </form>

    <script>
      const sessionId = crypto.randomUUID();
      const userEmail = window.HRIS_USER_EMAIL || "employee@company.com";
      const legalEntityId = window.HRIS_LEGAL_ENTITY_ID || 3;

      const chatLog = document.getElementById("chat-log");
      const form = document.getElementById("chat-form");
      const messageInput = document.getElementById("message");

      function addLine(kind, text) {
        const line = document.createElement("div");
        line.className = `line ${kind}`;
        line.textContent = `${kind === "user" ? "You" : "Assistant"}: ${text}`;
        chatLog.appendChild(line);
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const message = messageInput.value.trim();
        if (!message) return;

        addLine("user", message);
        messageInput.value = "";

        const payload = { sessionId, message, userEmail, legalEntityId };
        const response = await fetch("/webhook/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (!response.ok) {
          addLine("bot", "I could not process your request.");
          return;
        }

        const data = await response.json();
        addLine("bot", data.response || "No response received.");
      });
    </script>
  </body>
</html>
